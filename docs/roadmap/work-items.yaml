    hard_prerequisites: [PERF-TYPED-IR, PERF-SHAPE-ID, PERF-OPCODE-SPACE]
    authority: {file: docs/type-directed-optimization-plan.md, section: "T1"}
  - id: PERF-P05
    title: Interpreter feedback slots (Phase 0.5, per G1-FEEDBACK profile)
    type: implementation
    state: gated
    activation: [G1-FEEDBACK.not-disabled]
    hard_prerequisites: [PERF-SHAPE-ID, PERF-SIDECAR]
    notes: prerequisites also include the 08-17 IC-refutation reconciliation and the GC-line joint review (acceptance checklist)
    authority: {file: docs/engine-evolution-plan.md, section: "6"}
  - id: PERF-JIT
    title: Baseline JIT backend (direct machine code)
    type: implementation
    state: gated
    activation: [G1-JIT.eligible, BACKEND-ORDER]
    hard_prerequisites: [PERF-VMABI]
    notes: PERF-P05 and PERF-TYPED-IR are optional enhancements, not hard prerequisites
    authority: {file: docs/engine-evolution-plan.md, section: "8"}
  - id: PERF-AOT
