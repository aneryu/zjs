  - id: PERF-OPCODE-SPACE
    title: Opcode namespace plan (wide/prefix planes, versioning, shared generator, decode A/B)
    type: spec
    state: now
    wip_slot: decision
    hard_prerequisites: []
    notes: "consumers = FN-M1A, PERF-T1, CALL_NATIVE_*/typed families, SER-ARTIFACT opcode versioning. Two design inputs landed 2026-08-27: docs/perf/opcode-space-survey.md (extension vs reclaim mechanisms; V8/JSC prefix planes extend OPERAND WIDTH not numbering) and docs/perf/opcode-audit.md (per-opcode audit of all 251 against four engines). Ruling: reclaim, V8 pattern. Reclaimed so far: 9 ids (245 used / 11 free, from 254/2) -- 42, 16, 76, 72, 111 by demotion into the `using` cold plane, and 114-117 by the with_* merge (5 opcodes -> one `dyn_env_probe` carrying the operation in a kind field it already had room for; zero byte cost, zero dispatch cost; suite 2365/0 + test262 0/49778). Merging is a third mechanism alongside extension and demotion, documented in opcode-space-survey.md 8.7; its precondition (handlers already shared, compiler already holds the distinction as a value, spare operand bits) was verified to fail for the super and class-naming families. Audit headline: zjs spends 43 ids on seven families where the other three engines spend 0-4, and four of those families execute exactly 0 times in 41.9e9 (TDZ variants 9, Reference materialisation 6, with-specific access 5, super 4); the ~26-id estimate was superseded 2026-08-27 by a full per-family verification against the code (opcode-audit.md 12-14): of six families one held exactly, two had their numbers cut, two had the wrong mechanism (super and class naming are demotions, not redesigns) and one was void. Revised: 13 ids from three genuine variant merges (with_* DONE 4; make_*_ref 3; TDZ ~6 at ~70 edit sites) plus 13 by demotion"
    authority: {file: docs/type-directed-optimization-plan.md, section: "F4 / opcode space"}
