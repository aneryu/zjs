    title: Typed-slot interpreter benefit spike (polymorphic arm; u64 vs pinned-pointer guard arms)
    type: spike
    state: now
    wip_slot: implementation
    completion_commit: a2d9bc03
    evidence: reports/evidence/PERF-T-SPIKE/manifest.json
    notes: "2026-08-26 first round read +3.8% on a float-dominated loop and was written up as FAIL; 2026-08-27 that verdict was WITHDRAWN. A standalone controlled demo showed that workload hides the access entirely (probe and slot cost identical cycles behind a serial float chain), and a retest on property-dense workloads gives +8.9% (prop_dense) and +15.7% (chain_walk) -- the kill line is cleared on the shapes the policy actually named. Constant across all rounds: ~7-8% fewer instructions, polymorphic sites regress 6.4%, guard arms indistinguishable. Decisive evidence still owed: the real bench_v8 suite (needs the u8 site index widened)"
