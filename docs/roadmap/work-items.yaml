# Machine-readable work-item registry — the source of truth for roadmap.md's
# ID table, canonical DAG, and registry views. tools/docs/roadmap_lint.py
# validates this file and its consistency with roadmap.md on CI.
#
# Field semantics:
#   type:  governance | gate | spike | spec | implementation | measurement
#   state: now | ready | gated | blocked | later | incubator | done
#     ready   = all hard_prerequisites done (empty list counts as satisfied)
#     gated   = waits on a gate verdict listed in activation
#     blocked = at least one hard_prerequisite not done
#   activation:          non-DAG unlock conditions (gate verdicts, BASE-G0)
#   hard_prerequisites:  DAG edges (must be item ids; acyclic)
#   authority:           the normative document/section for this item

items:
  # ---- governance ----
  - id: BASE-DOC-NORM
    title: Domain-doc normalization (single current text, no stale verdicts)
    type: governance
    state: now
    hard_prerequisites: []
    deliverables: [evolution v0.6, typed v1.1, fnabi v0.5, hot-reload v1.5, process v0.5, README refs]
    acceptance: roadmap-lint forbidden-phrase scan passes; no contrary verdicts between roadmap and domain-doc bodies
    authority: {file: docs/roadmap.md, section: "0"}

  - id: BASE-ROADMAP-LINT
    title: Registry + roadmap consistency linter in CI
    type: governance
    state: now
    hard_prerequisites: []
    deliverables: [docs/roadmap/work-items.yaml, tools/docs/roadmap_lint.py, CI job]
    acceptance: lint green on CI for main pushes and PRs
    authority: {file: docs/roadmap.md, section: "4"}

  - id: BASE-G0
    title: Measurement freeze (reference fingerprints, policies, evidence layout)
    type: governance
    state: ready
    hard_prerequisites: []
    deliverables:
      - QuickJS commit/compiler/flags/binary sha256 + reproducible recipe
      - zjs merge-base + candidate sha256, dirty=false
      - suite revision + per-case source hash + skip policy
      - public immutable tracing ref (tag/commit, not a local branch name)
      - measurement_policy hash + gc_merge_policy.json + spike policy files
      - reports/evidence/ layout with per-item manifest schema
    acceptance: every official number in roadmap links to an evidence id; independent reproduction possible
    authority: {file: docs/roadmap.md, section: "0/2"}

  # ---- gates ----
  - id: G1-GC
    title: "GC verdict: continue P3 | time-box | pause"
    type: gate
    state: blocked
    hard_prerequisites: [GC-GAP]
    authority: {file: docs/roadmap.md, section: "2"}
  - id: G1-TYPED
    title: "Typed interpreter verdict: implement T1 | IR-only | pause"
    type: gate
    state: blocked
    hard_prerequisites: [PERF-T-SPIKE]
    authority: {file: docs/roadmap.md, section: "2"}
  - id: G1-FEEDBACK
    title: "Feedback profile verdict: disabled | collect-only | monomorphic | PIC2"
    type: gate
    state: blocked
    hard_prerequisites: [PERF-DYN-SPIKE]
    authority: {file: docs/roadmap.md, section: "2"}
  - id: G1-JIT
    title: "Baseline JIT verdict: eligible | redesign | later"
    type: gate
    state: blocked
    hard_prerequisites: [PERF-JIT-SPIKE]
    authority: {file: docs/roadmap.md, section: "2"}
  - id: G1-AOT
    title: "Native AOT verdict: eligible | later"
    type: gate
    state: blocked
    hard_prerequisites: [PERF-N-SPIKE]
    authority: {file: docs/roadmap.md, section: "2"}
  - id: BACKEND-ORDER
    title: "Backend ordering: JIT first | AOT first | parallel forbidden | both later"
    type: gate
    state: blocked
    hard_prerequisites: [G1-JIT, G1-AOT]
    authority: {file: docs/roadmap.md, section: "2"}

  # ---- performance evidence (spikes) ----
  - id: PERF-T-SPIKE
    title: Typed-slot interpreter benefit spike (polymorphic arm mandatory)
    type: spike
    state: ready
    activation: [BASE-G0.done]
    hard_prerequisites: []
    acceptance_policy: {path: policies/spikes/perf-t-spike-v1.json, status: pending}
    authority: {file: docs/type-directed-optimization-plan.md, section: "S2 / T-gate 0"}
  - id: PERF-DYN-SPIKE
    title: Dynamic-feedback minimal evidence (disposable side table; mono + PIC2 arms)
    type: spike
    state: ready
    activation: [BASE-G0.done]
    hard_prerequisites: []
    acceptance_policy: {path: policies/spikes/perf-dyn-spike-v1.json, status: pending}
    notes: outputs a concrete feedback profile, not a bare PASS; must reconcile the 08-17 IC refutation
    authority: {file: docs/roadmap.md, section: "2"}
  - id: PERF-JIT-SPIKE
    title: Baseline-JIT minimum closed-loop spike (8-12 opcodes, break-even analysis)
    type: spike
    state: blocked
    activation: [BASE-G0.done]
    hard_prerequisites: [PERF-VMABI]
    acceptance_policy: {path: policies/spikes/perf-jit-spike-v1.json, status: pending}
    notes: reports compile latency, code bytes/bytecode byte, entry/exit, bailout, break-even hotness, RW->RX/icache, code retirement
    authority: {file: docs/engine-evolution-plan.md, section: "Phase 2 spike gate"}
  - id: PERF-N-SPIKE
    title: Native Zig AOT shape spike (boundary cost, GC/exception closure)
    type: spike
    state: ready
    activation: [BASE-G0.done]
    hard_prerequisites: []
    acceptance_policy: {path: policies/spikes/perf-n-spike-v1.json, status: pending}
    authority: {file: docs/type-directed-optimization-plan.md, section: "5.1 / 8"}

