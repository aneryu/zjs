[tools]
zig = "0.16.0"
node = "24"
bun = "1"

# Every `zig build` here passes `-j32`. The build runner's worker pool is
# `cpu_count - 1` threads (7 on the eight-core pool), and a step dispatched
# past that limit runs INLINE on the runner's main thread -- which is still
# in the loop that dispatches the initial steps. On 2026-09-06 the merge
# gate's ReleaseFast `run-test262` compile therefore started only after the
# ReleaseFast `zjs` compile (56 s) had finished on the main thread: two
# compiles that share no dependency ran back to back. `-j` only sizes the
# runner's threads; the CPU work is whatever the graph spawns, so a high
# value costs nothing.
[env]
ZJS_BUILD_JOBS = "-j32"

[tasks.quick-gate]
description = "Run the Debug inner-loop gate once"
run = 'zig build quick-gate "$ZJS_BUILD_JOBS" --summary all'

[tasks.checkpoint-gate]
description = "Run the checkpoint gate"
run = 'zig build checkpoint-gate "$ZJS_BUILD_JOBS" --summary all'

[tasks.test-fast]
description = "Run tests whose names contain a required substring (mise run test-fast -- name)"
run = 'zig build test-fast "$ZJS_BUILD_JOBS" --summary all --'

# Reclaim build-cache and worktree debris. The Zig local cache has no
# garbage collection; on 2026-08-30 it had grown to 137 GB in this repo
# (plus ~500 GB of finished-lane worktrees). Trims o/ entries untouched
# for 7 days -- a trimmed entry is only a cache miss, never a correctness
# hazard (verified: `zig build check` green right after a trim). Worktree
# removal stays manual because dirty trees may hold unlanded work; this
# only prunes metadata for already-deleted ones.
[tasks.tidy]
description = "Trim >7-day zig-cache entries and prune stale worktree metadata"
run = """
find .zig-cache/o -maxdepth 1 -type d -mtime +7 -exec rm -rf {} +
rm -rf .zig-cache/tmp/*
git worktree prune
du -sh .zig-cache
"""

[tasks.worktree-init]
description = "Reuse the main worktree's test262 checkout from a linked worktree"
run = '"$MISE_TASK_DIR/tools/worktree_init.sh"'

# TGC S0 safety net: full test262 with the collector running at every
# safepoint (ZJS_GC_STRESS=1 -> cadence 64 ticks instead of 10_000). Writes
# its -R products to reports/test262-stress/ so the regular test262-latest
# directory is never overwritten. Pass extra run-test262 flags after `--`
# (e.g. `-m` for module mode, `-t 8` to cap threads).
[tasks.test262-stress]
description = "Full test262 under ZJS_GC_STRESS=1; -R products in reports/test262-stress/"
run = """
zig build run-test262 -Doptimize=ReleaseFast
ZJS_GC_STRESS=1 ./zig-out/bin/run-test262 -c test262.conf -d test262/test 0 100000 -R reports/test262-stress "$@"
"""

# Collector audit sweep: full test262 with the collector at every safepoint
# and the minor audit fatal, once in the default configuration and once with
# the copying nursery (ZJS_GC_NURSERY=1). ReleaseSafe keeps the audit arms
# (they need runtime safety) at ~20x Debug speed. Built into its own prefix so
# zig-out keeps whatever optimize mode it had.
[tasks.test262-gc-audit]
description = "Full test262 under GC stress + fatal minor audit, default and nursery mode"
run = """
zig build run-test262 -Doptimize=ReleaseSafe --prefix zig-out/gc-audit
ZJS_GC_STRESS=64 ZJS_GC_AUDIT=fatal ./zig-out/gc-audit/bin/run-test262 -c test262.conf -d test262/test -R reports/test262-gc-audit/default "$@"
ZJS_GC_NURSERY=1 ZJS_GC_STRESS=64 ZJS_GC_AUDIT=fatal ./zig-out/gc-audit/bin/run-test262 -c test262.conf -d test262/test -R reports/test262-gc-audit/nursery "$@"
"""

# Local one-shot of the same steps CI linux-arm64 already runs:
# Debug checkpoint, then shipped-mode test262.
[tasks.batch-gate]
description = "Local CI-equivalent batch: Debug checkpoint-gate, then ReleaseFast test262-check"
run = """
zig build checkpoint-gate "$ZJS_BUILD_JOBS" --summary all
zig build test262-check -Doptimize=ReleaseFast "$ZJS_BUILD_JOBS" --summary all
"""

[tasks.batch-gate-profile]
description = "Same as batch-gate plus ReleaseFast CLI/profile smoke"
run = """
zig build checkpoint-gate "$ZJS_BUILD_JOBS" --summary all
zig build test262-check smoke -Doptimize=ReleaseFast "$ZJS_BUILD_JOBS" --summary all
"""

[tasks.production-gate]
description = "Release gate: engine-production-gate at -Doptimize=ReleaseFast"
run = 'zig build engine-production-gate -Doptimize=ReleaseFast "$ZJS_BUILD_JOBS" --summary all'
