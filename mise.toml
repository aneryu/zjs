[tools]
zig = "0.16.0"

[tasks.quick-check]
description = "Run the Debug inner-loop gate once"
run = "zig build quick-check --summary all"

[tasks.checkpoint-check]
description = "Run the checkpoint gate"
run = "zig build checkpoint-check --summary all"

[tasks.quick-watch]
description = "Keep the Debug quick-check compiler alive for faster incremental edit feedback"
run = "zig build quick-check --watch -fincremental --summary new"
