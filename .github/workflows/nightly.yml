name: Nightly

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-publish
  cancel-in-progress: false

# Performance gates are never run in CI. The measurement contract forbids
# publishing performance numbers from shared runners.

jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: zig build engine-production-gate --summary all
      - run: zig build test -Doptimize=ReleaseSafe --summary all
      # Instrumentation tiers. These used to depend on a developer remembering
      # to run them when they touched the matching subsystem; that is how the
      # nan-boxing guard rotted into a permanent red without anyone noticing.
      # A machine runs them now.
      - run: zig build test-oom --summary all
      - run: zig build test -Dzjs_ownership_audit=true --summary all

  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: zig build engine-production-gate --summary all
      - run: zig build test -Doptimize=ReleaseSafe --summary all
      - name: Verify benchmark CLI contract
        run: |
          test "$(uname -m)" = "x86_64"
          expected="zjs-config-v2:compiler=v2,layout=short,repr=tagged,optimize=ReleaseFast,force_gc=off,ownership_audit=off"
          test "$(zig-out/bin/zjs --print-config-signature)" = "$expected"
      - name: Package Linux binary
        run: |
          mkdir -p release
          tar -C zig-out/bin -czf release/zjs-x86_64-unknown-linux-gnu.tar.gz zjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zjs-x86_64-unknown-linux-gnu
          path: release/zjs-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error

  macos-release:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
      - run: zig build zjs --summary all
      - run: zig build smoke --summary all
      - name: Verify benchmark CLI contract
        run: |
          test "$(uname -m)" = "arm64"
          expected="zjs-config-v2:compiler=v2,layout=short,repr=tagged,optimize=ReleaseFast,force_gc=off,ownership_audit=off"
          test "$(zig-out/bin/zjs --print-config-signature)" = "$expected"
      - name: Package macOS binary
        run: |
          mkdir -p release
          tar -C zig-out/bin -czf release/zjs-aarch64-apple-darwin.tar.gz zjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zjs-aarch64-apple-darwin
          path: release/zjs-aarch64-apple-darwin.tar.gz
          if-no-files-found: error

  windows-release:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
      - run: zig build zjs --summary all
      - run: zig build smoke --summary all
      - name: Verify benchmark CLI contract
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
            throw "Expected an x86_64 Windows runner, got $env:PROCESSOR_ARCHITECTURE"
          }
          $expected = "zjs-config-v2:compiler=v2,layout=short,repr=tagged,optimize=ReleaseFast,force_gc=off,ownership_audit=off"
          $actual = (& .\zig-out\bin\zjs.exe --print-config-signature | Out-String).Trim()
          if ($actual -ne $expected) {
            throw "Unexpected zjs configuration signature: $actual"
          }
      - name: Package Windows binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path zig-out\bin\zjs.exe -DestinationPath release\zjs-x86_64-pc-windows-msvc.zip -Force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zjs-x86_64-pc-windows-msvc
          path: release/zjs-x86_64-pc-windows-msvc.zip
          if-no-files-found: error

  release:
    needs: [linux-arm64, linux-x86_64, macos-release, windows-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zjs-x86_64-unknown-linux-gnu
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zjs-aarch64-apple-darwin
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zjs-x86_64-pc-windows-msvc
          path: release
      - name: Verify release assets
        run: |
          expected=(
            zjs-x86_64-unknown-linux-gnu.tar.gz
            zjs-aarch64-apple-darwin.tar.gz
            zjs-x86_64-pc-windows-msvc.zip
          )
          for asset in "${expected[@]}"; do
            test -s "release/$asset"
          done
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq "${#expected[@]}"
          sha256sum release/zjs-* > release/SHA256SUMS
      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag --force nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --title "Nightly"
            gh release upload nightly release/* --clobber
          else
            gh release create nightly release/* --title "Nightly" --verify-tag --notes "Automated multi-platform nightly build from $GITHUB_SHA."
          fi

  # A red gate nobody is told about is not a gate. Every failure lands on one
  # long-lived issue: the first failure opens it, later ones comment, and a
  # human closes it when the cause is fixed.
  notify-failure:
    needs: [linux-arm64, linux-x86_64, macos-release, windows-release, release]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly is failing"
          body="Nightly run failed for commit \`$GITHUB_SHA\`.

          Run log: $RUN_URL

          Close this issue once the nightly is green again."
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number,title \
            --jq "[.[] | select(.title == \"$title\") | .number] | first // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
