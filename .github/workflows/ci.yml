name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: zig build zjs --summary all
      - run: zig build checkpoint-gate --summary all
      - run: node tools/architecture/check_compiler_stage_boundaries.js zig-out/bin/zjs

  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # advisory until first green run on x86-64 (never executed on this arch before); driver flips to required
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: zig build zjs --summary all
      - run: zig build checkpoint-gate --summary all
      - run: node tools/architecture/check_compiler_stage_boundaries.js zig-out/bin/zjs

  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 60
    # advisory until first green run on macOS (never executed on this arch before); driver flips to required
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - run: zig build zjs --summary all
      - run: zig build smoke --summary all
