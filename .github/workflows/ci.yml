name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  roadmap-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: pip install pyyaml
      - run: python3 tools/docs/roadmap_lint.py

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: zig build zjs --summary all
      - run: zig build checkpoint-gate --summary all
      - run: node tools/architecture/check_compiler_stage_boundaries.js zig-out/bin/zjs
      # test262 is a zero-failure gate, so it is the sharpest semantic-regression
      # signal available. It runs on the primary development platform only:
      # results are architecture-independent, and a second copy would buy noise.
      - run: zig build test262-check --summary all
      # The rc collector is the supported rollback since the Stage 7 default
      # flip; keep it compiling and smoking so the rollback path cannot rot.
      - run: zig build smoke -Dzjs_gc=rc --summary all

  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: zig build zjs --summary all
      - run: zig build checkpoint-gate --summary all
      - run: node tools/architecture/check_compiler_stage_boundaries.js zig-out/bin/zjs

  macos-build-smoke:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
      - run: zig build zjs --summary all
      - run: zig build smoke --summary all

  windows-build-smoke:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
      - run: zig build zjs --summary all
      - run: zig build smoke --summary all
