name: Release CLI

# Publish stripped zjs CLI archives that easy-install can install with
# `ei https://github.com/aneryu/zjs`. Asset names must keep a rustc target
# triple so js-engine-setup can pick the host binary.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - run: zig build zjs --seed 0 --summary all
      - name: Package
        run: |
          bash tools/perf/js_engine_benchmark/package_cli.sh \
            zig-out/bin/zjs \
            ${{ matrix.target }} \
            dist
      - uses: actions/upload-artifact@v4
        with:
          name: zjs-${{ matrix.target }}
          path: dist/zjs-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: zjs-*
          merge-multiple: true
      - name: Publish nightly
        if: github.event_name != 'push'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/zjs-*"
          allowUpdates: true
          tag: nightly
          name: nightly
          token: ${{ secrets.GITHUB_TOKEN }}
          commit: ${{ github.sha }}
          replacesArtifacts: true
          body: |
            Stripped ReleaseFast `zjs` CLI for
            [js-engine-benchmark](https://github.com/ahaoboy/js-engine-benchmark)
            / [easy-install](https://github.com/easy-install/easy-install):

            ```
            ei https://github.com/aneryu/zjs
            ```
      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/zjs-*"
          allowUpdates: true
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          replacesArtifacts: true
          omitBodyDuringUpdate: true
